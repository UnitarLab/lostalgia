<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark retro background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Bubble base -->
    <radialGradient id="bBase" cx="38%" cy="35%" r="62%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="18%"  stop-color="#c8f0ff" stop-opacity="0.80"/>
      <stop offset="40%"  stop-color="#b8aaff" stop-opacity="0.55"/>
      <stop offset="62%"  stop-color="#ff9de2" stop-opacity="0.45"/>
      <stop offset="82%"  stop-color="#7fefbd" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0.30"/>
    </radialGradient>

    <!-- Rim gradient -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6fcf"/>
      <stop offset="25%"  stop-color="#7c6fff"/>
      <stop offset="50%"  stop-color="#00d4ff"/>
      <stop offset="75%"  stop-color="#44ffa0"/>
      <stop offset="100%" stop-color="#ffe566"/>
    </linearGradient>

    <!-- Gloss -->
    <radialGradient id="bGloss" cx="32%" cy="28%" r="36%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="45%"  stop-color="#e0f8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Refraction -->
    <linearGradient id="bRefract" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe0fb" stop-opacity="0.0"/>
      <stop offset="40%"  stop-color="#c3adff" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#7fffea" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffe0fb" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="bClip">
      <circle cx="200" cy="315" r="160"/>
    </clipPath>

    <!-- Scanline pattern for retro feel -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1200" height="2" fill="rgba(255,255,255,0.025)"/>
    </pattern>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(100,120,255,0.06)" stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Decorative ambient glow blobs -->
  <ellipse cx="200" cy="315" rx="280" ry="280" fill="#4040ff" opacity="0.04"/>
  <ellipse cx="900" cy="200" rx="300" ry="200" fill="#ff40cc" opacity="0.04"/>
  <ellipse cx="1000" cy="500" rx="200" ry="150" fill="#00ffcc" opacity="0.04"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="url(#rGrad)" stroke-width="1.5" opacity="0.4" rx="8"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" rx="6"/>

  <!-- ── BUBBLE ── -->
  <!-- Shadow -->
  <ellipse cx="200" cy="492" rx="80" ry="12" fill="#000" opacity="0.25"/>

  <!-- Rainbow ring -->
  <circle cx="200" cy="315" r="164" fill="none" stroke="url(#rGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Bubble body -->
  <circle cx="200" cy="315" r="160" fill="url(#bBase)"/>

  <!-- Refraction band -->
  <ellipse cx="200" cy="322" rx="160" ry="80" fill="url(#bRefract)" clip-path="url(#bClip)"/>

  <!-- Gloss -->
  <ellipse cx="148" cy="248" rx="64" ry="46" fill="url(#bGloss)" opacity="0.95"/>

  <!-- Sharp highlight -->
  <ellipse cx="130" cy="224" rx="18" ry="11" fill="white" opacity="0.97"/>
  <ellipse cx="124" cy="217" rx="7" ry="4.5" fill="white" opacity="1"/>

  <!-- Secondary highlight -->
  <ellipse cx="262" cy="384" rx="18" ry="10" fill="white" opacity="0.22" transform="rotate(-25 262 384)"/>

  <!-- Inner ring -->
  <circle cx="200" cy="315" r="150" fill="none" stroke="url(#rGrad)" stroke-width="1.2" opacity="0.35"/>

  <!-- ── TEXT ── -->
  <!-- "LOSTALGIA" main title -->
  <text
    x="430" y="280"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="92"
    font-weight="bold"
    fill="white"
    opacity="0.95"
    filter="url(#textGlow)"
    letter-spacing="2"
  >LOSTALGIA</text>

  <!-- Divider line -->
  <line x1="430" y1="308" x2="1140" y2="308" stroke="url(#rGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Subtitle -->
  <text
    x="432" y="356"
    font-family="Tahoma, 'Segoe UI', Arial, sans-serif"
    font-size="26"
    fill="#a0b8ff"
    letter-spacing="4"
    opacity="0.85"
  >AESTHETICS WIKI EXPLORER</text>

  <!-- Description -->
  <text
    x="432" y="420"
    font-family="Tahoma, Arial, sans-serif"
    font-size="20"
    fill="#6a7a9a"
    letter-spacing="1"
  >Browse 1,100+ internet aesthetics — images, lore &amp; vibes</text>

  <!-- Corner badge -->
  <rect x="1060" y="560" width="100" height="30" rx="4" fill="rgba(100,120,255,0.15)" stroke="rgba(100,120,255,0.3)" stroke-width="1"/>
  <text x="1110" y="580" font-family="Tahoma, sans-serif" font-size="12" fill="#6a7aff" text-anchor="middle" letter-spacing="1">lostalgia.vercel.app</text>
</svg>
